# =====================================================================
# SupportPilot - Sessions 1-4
# Profiles:   (default) -> OpenAI        local -> Ollama        anthropic -> Claude
# Run:        mvn spring-boot:run -Dspring-boot.run.profiles=local
# Never put API keys in this file - they come from environment variables.
# Session 2 needs PostgreSQL:  docker compose up -d
# =====================================================================
spring:
  application:
    name: supportpilot
  ai:
    model:
      chat: openai            # which ChatModel is active: openai | anthropic | ollama
      # Session 3: which EmbeddingModel turns text into vectors: openai | ollama
      embedding: openai
      # Model types we don't use yet are switched off, so unused providers
      # do not ask for API keys at startup.
      image: none
      audio:
        transcription: none
        speech: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}   # 1536 dimensions
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        model: ${ANTHROPIC_CHAT_MODEL:claude-haiku-4-5}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:llama3.2}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}         # 768 dimensions
      init:
        pull-model-strategy: when_missing   # downloads the model on first start if needed
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always       # creates the SPRING_AI_CHAT_MEMORY table on start
    # Session 3, Checkpoint A: pgvector. Each embedding model gets its own table,
    # because vectors from different models (and dimensions) cannot be mixed.
    vectorstore:
      pgvector:
        initialize-schema: true             # creates the extension, table and index on start
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        table-name: vector_store_openai

  # Session 2, Checkpoint D: PostgreSQL for chat memory (docker compose up -d)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/supportpilot}
    username: ${DB_USER:supportpilot}
    password: ${DB_PASSWORD:supportpilot}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    # DEBUG shows every prompt and response logged by SimpleLoggerAdvisor.
    # Great for learning - turn it off in production (prompts can contain personal data).
    org.springframework.ai.chat.client.advisor: DEBUG

supportpilot:
  homework:
    questions: homework/questions.txt
    results-dir: results
  # Session 2, Checkpoint A: which prompt file to use (prompts/triage-system-<version>.st)
  triage:
    prompt-version: v1
    native-structured-output: true   # send the JSON schema to the provider as an API constraint
  # Session 2, Checkpoint D: how many messages of history are sent back to the model
  memory:
    max-messages: 20
  # Session 2, Checkpoint E: labelled tickets for the accuracy runner
  accuracy:
    dataset: data/tickets-labelled.csv
  # Session 3: knowledge base, chunking and retrieval settings
  knowledge:
    dir: kb
    catalog: kb/catalog.csv
    chunking: token           # token | window (window = with overlap, see SlidingWindowSplitter)
    chunk-size: 512           # tokens per chunk
    overlap: 64               # tokens shared by neighbouring chunks (window only)
    top-k: 5                  # chunks given to the model per question
    similarity-threshold: 0.3 # minimum cosine similarity; depends on the embedding model!
  rag-eval:
    questions: data/rag-questions.csv
  # Session 4: the production-grade RAG pipeline behind /answer and /retrieve.
  # Every switch can be overridden per request, e.g. /answer?q=...&hybrid=false
  rag:
    top-n: 5                  # chunks that finally go into the prompt
    candidates: 20            # chunks fetched per search before fusion and re-ranking narrow them down
    prompt-version: v2
    # Checkpoint B: query transformation. Helper calls use this model (empty = the chat model).
    helper-model: ${RAG_HELPER_MODEL:}
    rewrite: true
    expansions: 2
    # Checkpoint D: hybrid search (PostgreSQL full-text + pgvector, fused with RRF)
    hybrid: true
    rrf-k: 60
    text-search-config: english
    # Checkpoint E: re-ranking and verified citations
    rerank: true
    min-relevance: 3
    native-structured-output: true

---
spring:
  config:
    activate:
      on-profile: local
  ai:
    model:
      chat: ollama
      embedding: ollama
    vectorstore:
      pgvector:
        dimensions: 768
        table-name: vector_store_ollama

---
spring:
  config:
    activate:
      on-profile: anthropic
  ai:
    model:
      chat: anthropic
      # Anthropic has no embedding API, so embeddings come from Ollama (free, local).
      embedding: ollama
    vectorstore:
      pgvector:
        dimensions: 768
        table-name: vector_store_ollama

---
# Homework runner: combine with a provider profile, e.g. --spring.profiles.active=local,compare
spring:
  config:
    activate:
      on-profile: compare
  main:
    web-application-type: none

---
# Session 2 triage accuracy runner: combine with a provider profile, e.g. --spring.profiles.active=local,accuracy
spring:
  config:
    activate:
      on-profile: accuracy
  main:
    web-application-type: none

---
# Session 3 homework: re-ingest and evaluate retrieval, e.g. --spring.profiles.active=local,rag-eval
spring:
  config:
    activate:
      on-profile: rag-eval
  main:
    web-application-type: none
