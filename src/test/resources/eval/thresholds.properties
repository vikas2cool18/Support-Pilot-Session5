# Quality gate for the evaluation suite (mvn -Peval verify).
# Start from a baseline run, set each threshold a little below it, and raise it as quality improves.
# Thresholds depend on the models: a small local model will not reach the numbers of a large API model.
# Override any value for one run with -Deval.threshold.<name>=<value>, e.g. -Deval.threshold.faithfulness=3.5

# Deterministic checks (0-1)
pass-rate=0.70
answerable-accuracy=0.85
retrieval-hit-rate=0.85
citation-verified-rate=0.80

# LLM judge averages (1-5)
faithfulness=4.0
relevance=4.0
correctness=3.5

# Triage (Session 2 dataset)
triage-category-accuracy=0.80

# Judge calibration: share of scores within 1 point of the human label
judge-agreement-within-one=0.80
